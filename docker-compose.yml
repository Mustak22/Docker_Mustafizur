services:

  backend:
    build:
      context: ./backend
    container_name: flask-backend
    expose:
      - "5000"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: node-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
